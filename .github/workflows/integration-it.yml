# Integration Tests for ddd4j-javalin MQ brokers (feature/7.1.x)
#
# Each broker runs in an independent matrix job to avoid container OOM on a
# single machine (lesson: running multiple Testcontainers brokers in parallel
# causes OOM). Slowest brokers: Kafka ~5 min, SQS ~3 min.
#
# This branch follows ddd4j 2.0.x with Maven 3, POM 4.0.0 and <modules>.
# ddd4j core SNAPSHOTs resolve
# from the Aliyun private repo via org secret MAVEN_SETTINGS_XML.
#
# Excluded (all @Disabled in source, will not execute):
#   - ddd4j-javalin-mq-mqtt-mica  (Ddd4jMicaMqttMqIT  @Disabled)
#   - ddd4j-javalin-mq-ons        (Ddd4jOnsMqIT        @Disabled)
#   - ddd4j-javalin-mq-tdmq       (Ddd4jTdmqMqIT       @Disabled)
#
# Triggered by:
#   - workflow_dispatch (manual)
#   - push that changes this workflow file itself
#   - weekly schedule (Monday 02:00 UTC)

name: Integration Tests

on:
  workflow_dispatch:
  push:
    branches: [feature/7.1.x]
    paths:
      - '.github/workflows/integration-it.yml'
  schedule:
    # Weekly on Monday at 02:00 UTC
    - cron: '0 2 * * 1'

permissions:
  contents: read

concurrency:
  group: it-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-test:
    name: "IT: ${{ matrix.broker }}"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Each broker is an independent job — avoids container OOM from parallel brokers
    strategy:
      fail-fast: false
      matrix:
        include:
          - broker: rocketmq
            module: ddd4j-javalin-mq/ddd4j-javalin-mq-rocketmq
          - broker: kafka
            module: ddd4j-javalin-mq/ddd4j-javalin-mq-kafka
          - broker: activemq
            module: ddd4j-javalin-mq/ddd4j-javalin-mq-activemq
          - broker: pulsar
            module: ddd4j-javalin-mq/ddd4j-javalin-mq-pulsar
          - broker: rabbitmq
            module: ddd4j-javalin-mq/ddd4j-javalin-mq-rabbitmq
          - broker: nats
            module: ddd4j-javalin-mq/ddd4j-javalin-mq-nats
          - broker: sqs
            module: ddd4j-javalin-mq/ddd4j-javalin-mq-sqs
          - broker: redis-stream
            module: ddd4j-javalin-mq/ddd4j-javalin-mq-redis-stream
          - broker: mqtt
            module: ddd4j-javalin-mq/ddd4j-javalin-mq-mqtt
    steps:
      # ── 1. Checkout ddd4j-javalin ──────────────────────────────────────
      - name: Checkout ddd4j-javalin
        uses: actions/checkout@v4

      # ── 2. Setup JDK 17 + Maven cache ─────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          overwrite-settings: true

      # ── 3. Private repo settings (org secret MAVEN_SETTINGS_XML) ──────
      - name: Write Maven settings from org secret
        env:
          MAVEN_SETTINGS_XML: ${{ secrets.MAVEN_SETTINGS_XML }}
        shell: bash
        run: |
          install -d -m 700 "$HOME/.m2"
          umask 077
          python3 -c "
          import os
          from xml.etree import ElementTree
          content = os.environ.get('MAVEN_SETTINGS_XML', '')
          target = os.path.expanduser('~/.m2/settings.xml')
          with open(target, 'w') as settings_file:
              settings_file.write(content)
          size = os.path.getsize(target)
          if size < 50:
              print('::error::MAVEN_SETTINGS_XML produced invalid settings.xml (too small)')
              exit(1)
          ElementTree.parse(target)
          if '2624322-snapshot-3EoOv3' not in content:
              print('::error::settings.xml missing Aliyun snapshot repository')
              exit(1)
          print('Maven settings validated')
          "

      # ── 4. Run integration tests for this broker ──────────────────────
      # ubuntu-latest has Docker pre-installed; Testcontainers works out of
      # the box. -am builds required upstream modules (core, parent, etc.)
      - name: "Run IT: ${{ matrix.broker }}"
        run: >-
          mvn -U -Denforcer.skip=true -B verify
          -Pjavalin-integration-tests
          -pl ${{ matrix.module }}
          -am
