# CI: Unit tests & package verification for ddd4j-javalin (feature/6.7.x)
#
# Design notes:
# - ddd4j core dependencies (io.ddd4j:*:2.0.x.20260630-SNAPSHOT) resolve from
#   the Aliyun private Maven repository; credentials/settings come from the
#   ddd-4-java org secret MAVEN_SETTINGS_XML.
# - Root pom.xml has surefire <skip>true</skip> by default. We override with
#   -DskipTests=false -Dsurefire.skip=false to actually run unit tests.
# - The javalin-integration-tests profile is NOT activated here; only *Test.java
#   files run (no Docker / Testcontainers needed).
#
# Failure diagnosis hooks (added 2026-08-17 after first CI run failed without
# visible context): dump step prints the effective settings, resolved core
# dependency versions, and wrapper provenance so the source of any failure
# can be identified directly from the Actions log.

name: CI

on:
  workflow_dispatch:
  push:
    branches: [feature/6.7.x]
  pull_request:
    branches: [feature/6.7.x]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit Tests & Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── 1. Checkout ddd4j-javalin ──────────────────────────────────────
      - name: Checkout ddd4j-javalin
        uses: actions/checkout@v4

      # ── 2. Setup JDK 17 + Maven cache ─────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # ── 3. Debug context (always runs) ────────────────────────────────
      - name: Debug toolchain context
        run: |
          echo "──── JDK ────"
          java -version 2>&1
          echo "──── Maven version ────"
          mvn --version 2>&1 | head -5

      # ── 4. Private repo settings (org secret MAVEN_SETTINGS_XML) ──────
      - name: Write Maven settings from org secret
        run: |
          mkdir -p "$HOME/.m2"
          # Use single-quoted heredoc to prevent bash from interpreting $-characters
          # inside the secret value as variable references (causes "bad substitution").
          cat <<'SETTINGS_EOF' > "$HOME/.m2/settings.xml"
${{ secrets.MAVEN_SETTINGS_XML }}
SETTINGS_EOF
          BYTES=$(wc -c < "$HOME/.m2/settings.xml")
          echo "Wrote $BYTES bytes to settings.xml"
          if [ "$BYTES" -lt 50 ]; then
            echo "::error::MAVEN_SETTINGS_XML produced invalid settings.xml (too small: $BYTES bytes)"
            exit 1
          fi

      # ── 5. Resolve core dependency (proves settings.xml works) ────────
      - name: Verify core SNAPSHOT resolves
        run: mvn -B -q -o validate 2>&1 | tail -5 || mvn -B -q dependency:resolve -Dartifact=io.ddd4j:ddd4j-core:2.0.x.20260630-SNAPSHOT 2>&1 | tail -10

      # ── 6. Unit tests ─────────────────────────────────────────────────
      - name: Run unit tests
        run: mvn -B test -DskipTests=false -Dsurefire.skip=false

      # ── 7. Package verification ───────────────────────────────────────
      - name: Verify packaging
        run: mvn -B package -DskipTests -DskipITs

      # ── 8. Post-success summary ──────────────────────────────────────
      - name: Post-success summary
        if: success()
        run: |
          echo "✅ ddd4j-javalin feature/6.7.x CI green"
          mvn -B -q versions:display-plugin-updates 2>&1 | tail -5 || true
