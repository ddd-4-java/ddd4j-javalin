# CI: Unit tests & package verification for ddd4j-javalin (feature/7.2.x)
#
# Design notes:
# - This branch is Maven 4 (modelVersion 4.1.0 + <subprojects>): use ./mvnw
#   (wrapper pinned to apache-maven 4.0.0-rc-6).
# - ddd4j core dependencies (io.ddd4j:*:3.0.x.20260630-SNAPSHOT) resolve from
#   the Aliyun private Maven repository; credentials/settings come from the
#   org secret MAVEN_SETTINGS_XML (written to ~/.m2/settings.xml).
# - Root pom.xml has surefire <skip>true</skip> by default. We override with
#   -DskipTests=false -Dsurefire.skip=false to actually run unit tests.
# - The javalin-integration-tests profile is NOT activated here; only *Test.java
#   files run (no Docker / Testcontainers needed).

name: CI

on:
  workflow_dispatch:
  push:
    branches: [feature/7.2.x]
  pull_request:
    branches: [feature/7.2.x]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit Tests & Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── 1. Checkout ddd4j-javalin ──────────────────────────────────────
      - name: Checkout ddd4j-javalin
        uses: actions/checkout@v4

      # ── 2. Setup JDK 17 + Maven cache ─────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # ── 3. Private repo settings (org secret MAVEN_SETTINGS_XML) ──────
      # Contains the Aliyun packages repository + credentials needed to
      # resolve io.ddd4j:* SNAPSHOT artifacts.
      - name: Write Maven settings from org secret
        run: |
          mkdir -p "$HOME/.m2"
          # Use single-quoted heredoc to avoid bash $-expansion of secret content
          # (the secret may contain $HOME, ${revision} etc. from Maven properties)
          cat <<'SETTINGS_EOF' > "$HOME/.m2/settings.xml"
${{ secrets.MAVEN_SETTINGS_XML }}
SETTINGS_EOF
          echo "Wrote $(wc -c < "$HOME/.m2/settings.xml") bytes to settings.xml"
          if ! head -1 "$HOME/.m2/settings.xml" | grep -q '<'; then
            echo "::error::MAVEN_SETTINGS_XML produced invalid settings.xml"
            exit 1
          fi

      # ── 4. Unit tests (Maven 4 via wrapper) ───────────────────────────
      # Root pom disables surefire by default (<skip>true</skip>), so we
      # must explicitly re-enable it.
      - name: Run unit tests
        run: ./mvnw -B test -DskipTests=false -Dsurefire.skip=false

      # ── 5. Package verification (no tests) ────────────────────────────
      - name: Verify packaging
        run: ./mvnw -B package -DskipTests -DskipITs
