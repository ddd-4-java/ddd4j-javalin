# CI: Unit tests & package verification for ddd4j-javalin (feature/6.3.x)
#
# Design notes:
# - ddd4j core dependency (io.ddd4j:ddd4j-*:2.0.x.20260630-SNAPSHOT) is NOT in any
#   public Maven repository. We checkout ddd-4-java/ddd4j (feature/1.0.x) and
#   install it into the local Maven cache before building this repo.
# - Root pom.xml has surefire <skip>true</skip> by default. We override with
#   -DskipTests=false -Dsurefire.skip=false to actually run unit tests.
# - The javalin-integration-tests profile is NOT activated here; only *Test.java
#   files run (no Docker / Testcontainers needed).

name: CI

on:
  push:
    branches: [feature/6.3.x]
  pull_request:
    branches: [feature/6.3.x]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit Tests & Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── 1. Checkout ddd4j-javalin ──────────────────────────────────────
      - name: Checkout ddd4j-javalin
        uses: actions/checkout@v4

      # ── 2. Checkout ddd4j core (private SNAPSHOT dependency) ──────────
      - name: Checkout ddd4j core
        uses: actions/checkout@v4
        with:
          repository: ddd-4-java/ddd4j
          ref: feature/1.0.x
          path: ddd4j-core

      # ── 3. Setup JDK 17 + Maven cache ─────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # ── 4. Install ddd4j core SNAPSHOT into local repo ────────────────
      # Core repo is large; -T 1C parallelizes modules. -DskipTests avoids
      # running core's own tests. If BOM/parent resolution fails, ensure the
      # ddd4j-parent artifact is installed first (Maven reactor handles this
      # automatically when building from the root pom).
      - name: Install ddd4j core SNAPSHOT
        run: mvn -B -T 1C -f ddd4j-core/pom.xml install -DskipTests -Dmaven.test.skip=true

      # ── 5. Unit tests ─────────────────────────────────────────────────
      # Root pom disables surefire by default (<skip>true</skip>), so we
      # must explicitly re-enable it.
      - name: Run unit tests
        run: mvn -B test -DskipTests=false -Dsurefire.skip=false

      # ── 6. Package verification (no tests) ────────────────────────────
      - name: Verify packaging
        run: mvn -B package -DskipTests -DskipITs
