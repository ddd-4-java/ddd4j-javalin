# CI: Unit tests & package verification for ddd4j-javalin (feature/6.7.x)
#
# Design notes:
# - ddd4j core dependency (io.ddd4j:ddd4j-*:2.0.x.20260630-SNAPSHOT) is NOT in any
#   public Maven repository; they resolve from the Aliyun private Maven repo,
#   credentials/settings from the ddd-4-java org secret MAVEN_SETTINGS_XML.
# - Root pom.xml has surefire <skip>true</skip> by default. We override with
#   -DskipTests=false -Dsurefire.skip=false to actually run unit tests.
# - The javalin-integration-tests profile is NOT activated here; only *Test.java
#   files run (no Docker / Testcontainers needed).

name: CI

on:
  push:
    branches: [feature/6.7.x]
  pull_request:
    branches: [feature/6.7.x]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit Tests & Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── 1. Checkout ddd4j-javalin ──────────────────────────────────────
      - name: Checkout ddd4j-javalin
        uses: actions/checkout@v4

      # ── 3. Setup JDK 17 + Maven cache ─────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # ── 4. Configure Maven settings (org secret) ─────────────────────
      # ddd-4-java 组织 secret MAVEN_SETTINGS_XML：完整 settings.xml（阿里云私服
      # 2624322-* 凭据 + 仓库）；secrets 不能用于 if 条件，经 env 传递判空
      - name: Configure Maven settings (org secret)
        env:
          MAVEN_SETTINGS_XML: ${{ secrets.MAVEN_SETTINGS_XML }}
        run: |
          if [ -n "$MAVEN_SETTINGS_XML" ]; then
            mkdir -p ~/.m2
            printf '%s' "$MAVEN_SETTINGS_XML" > ~/.m2/settings.xml
          fi

      # ── 5. Unit tests ─────────────────────────────────────────────────
      # Root pom disables surefire by default (<skip>true</skip>), so we
      # must explicitly re-enable it.
      - name: Run unit tests
        run: mvn -B test -DskipTests=false -Dsurefire.skip=false

      # ── 6. Package verification (no tests) ────────────────────────────
      - name: Verify packaging
        run: mvn -B package -DskipTests -DskipITs
